<style>
  :root {
    --ink: #000;
    --sky: #33A1FF;
    --yellow: #FFEA00;
    --magenta: #FF00FF;
  }

  * { -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: var(--sky);
    overflow-x: hidden;
  }

  /* ---- Sticker effect ---- */
  .sticker {
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 0 var(--ink);
    border-radius: 28px 22px 30px 20px / 22px 30px 20px 28px;
    background: #fff;
  }
  .sticker-alt {
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 0 var(--ink);
    border-radius: 22px 30px 20px 28px / 30px 20px 28px 22px;
  }
  .sticker-btn {
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 0 var(--ink);
    border-radius: 999px 999px 999px 999px / 80% 80% 120% 120%;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .sticker-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 0 var(--ink);
  }
  .sticker-tag {
    border: 2.5px solid var(--ink);
    box-shadow: 3px 3px 0 0 var(--ink);
    border-radius: 18px 12px 20px 10px / 12px 20px 10px 18px;
  }

  /* ---- Text outline ---- */
  .text-outline {
    -webkit-text-stroke: 3px var(--ink);
    text-stroke: 3px var(--ink);
    paint-order: stroke fill;
  }
  .text-outline-sm {
    -webkit-text-stroke: 2px var(--ink);
    text-stroke: 2px var(--ink);
    paint-order: stroke fill;
  }

  /* ---- Background lightning ---- */
  .lightning-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bolt {
    position: absolute;
    opacity: .55;
    animation: flicker 3.2s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: .18; }
    12% { opacity: .7; }
    18% { opacity: .2; }
    55% { opacity: .5; }
    62% { opacity: .15; }
  }

  /* ---- Spark button pulse ---- */
  .spark-pulse {
    animation: sparkPulse 1.8s ease-in-out infinite;
  }
  @keyframes sparkPulse {
    0%, 100% { box-shadow: 4px 4px 0 0 var(--ink), 0 0 0 0 rgba(255,0,255,.55); }
    50% { box-shadow: 4px 4px 0 0 var(--ink), 0 0 0 14px rgba(255,0,255,0); }
  }

  /* ---- Modal ---- */
  .modal-backdrop {
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(3px);
  }
  .modal-panel {
    border: 3px solid var(--ink);
    box-shadow: 10px 10px 0 0 var(--ink);
    border-radius: 32px 26px 36px 22px / 26px 36px 22px 32px;
  }
  .modal-enter { animation: modalIn .32s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes modalIn {
    from { transform: translateY(40px) scale(.96); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ---- Loading dots ---- */
  .dot { animation: dotBounce 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ---- Skeleton shimmer ---- */
  .shimmer {
    background: linear-gradient(90deg, #eee 25%, #f7f7f7 50%, #eee 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ---- Card hover ---- */
  .card-hover {
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card-hover:hover {
    transform: translate(-3px, -3px) rotate(-.4deg);
    box-shadow: 9px 9px 0 0 var(--ink);
  }

  /* ---- Wavy shapes ---- */
  .wave-shape {
    border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
  }

  /* ---- Scrollbar ---- */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #1E7FD1; }
  ::-webkit-scrollbar-thumb { background: #FFEA00; border: 2px solid #000; border-radius: 8px; }

  /* ---- Tag colors ---- */
  .tag-shoot { background: #FFEA00; color: #000; }
  .tag-fest  { background: #C8B6FF; color: #000; }
  .tag-monet { background: #FF00FF; color: #fff; }
  .tag-system{ background: #B8F2E6; color: #000; }
  .tag-char  { background: #FFB5A7; color: #000; }
  .tag-world { background: #FFD166; color: #000; }
  .tag-big   { background: #FF85A2; color: #fff; }
</style>

/* ============================ RENDER FEED ============================ */
const feedEl = document.getElementById('feed');
const emptyEl = document.getElementById('emptyState');
const filterBtns = document.querySelectorAll('.filter-btn');
let activeFilter = '全部';

function cardHTML(item) {
  return `
    <article class="sticker card-hover overflow-hidden flex flex-col h-full" data-id="${item.id}">
      <!-- cover: unified 16:9 frame, oversized art cropped from focal point -->
      <div class="relative overflow-hidden">
        <img src="${item.image}?v=3" alt="${item.game}"
             class="block w-full aspect-video object-cover"
             style="object-position:${item.pos || 'center'}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="hidden w-full aspect-video bg-spark-cream items-center justify-center">
          <svg viewBox="0 0 24 24" class="w-12 h-12 text-spark-skyDeep/40" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </div>
        <span class="absolute top-3 left-3 sticker-tag bg-white px-3.5 py-2 text-sm font-black">${item.game}</span>
      </div>
      <!-- body -->
      <div class="p-4 flex flex-col flex-1">
        <!-- tags -->
        <div class="flex flex-wrap gap-1.5 mb-2.5 h-6 overflow-hidden">
          ${item.tags.map(tg => `<span class="sticker-tag ${tg.c} px-2.5 py-0.5 text-[11px] font-black">${tg.t}</span>`).join('')}
        </div>
        <h2 class="font-black text-base md:text-lg leading-snug mb-2 line-clamp-2 min-h-[3.5rem]">${item.title}</h2>
        <p class="text-sm text-neutral-600 leading-relaxed flex-1 line-clamp-3">${item.summary}</p>
        <!-- actions -->
        <div class="flex items-center justify-between mt-4 pt-3 border-t-2 border-black/10">
          <a href="${item.source}" target="_blank" rel="noopener" class="text-sm font-bold text-spark-skyDeep hover:underline inline-flex items-center gap-1">
            查看原文
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="currentColor"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3z"/></svg>
          </a>
          <button class="spark-btn sticker-btn bg-spark-magenta text-white px-4 py-2 text-sm font-black spark-pulse inline-flex items-center gap-1.5" data-id="${item.id}">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            Spark 分析
          </button>
        </div>
      </div>
    </article>`;
}

function bindSparkButtons() {
  document.querySelectorAll('.spark-btn').forEach(btn => {
    btn.addEventListener('click', () => openSpark(parseInt(btn.dataset.id)));
  });
}

function renderFeed(filter = '全部') {
  activeFilter = filter;
  const list = filter === '全部'
    ? FEED
    : FEED.filter(item => item.tags.some(tg => tg.t === filter));

  if (list.length === 0) {
    feedEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    emptyEl.classList.add('block');
  } else {
    emptyEl.classList.add('hidden');
    emptyEl.classList.remove('block');
    feedEl.innerHTML = list.map(cardHTML).join('');
    bindSparkButtons();
  }
}

/* ---- Tag filter wiring ---- */
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    // active button -> yellow, others -> white
    filterBtns.forEach(b => {
      b.classList.remove('bg-spark-yellow');
      b.classList.add('bg-white');
    });
    btn.classList.add('bg-spark-yellow');
    btn.classList.remove('bg-white');
    renderFeed(f);
    window.scrollTo({ top: document.getElementById('filterNav').offsetTop - 10, behavior: 'smooth' });
  });
});

/* ============================ SPARK MODAL ============================ */
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
const closeBtn = document.getElementById('closeModal');

function openSpark(id) {
  const item = FEED.find(f => f.id === id);
  if (!item) return;
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  modalBody.innerHTML = `
    <div class="flex items-center gap-2 mb-3">
      <span class="sticker-tag bg-spark-yellow px-2.5 py-0.5 text-[11px] font-black">${item.game}</span>
    </div>
    <h4 class="font-black text-base leading-snug mb-4">${item.title}</h4>

    <!-- Loading state -->
    <div id="loadingState" class="space-y-4">
      <div class="flex items-center gap-3 text-sm font-bold text-neutral-600">
        <div class="flex gap-1">
          <span class="dot w-2.5 h-2.5 rounded-full bg-spark-magenta inline-block"></span>
          <span class="dot w-2.5 h-2.5 rounded-full bg-spark-magenta inline-block"></span>
          <span class="dot w-2.5 h-2.5 rounded-full bg-spark-magenta inline-block"></span>
        </div>
        Spark 脑机接口连接中…正在刺穿公关话术
      </div>
      <div class="space-y-2">
        <div class="shimmer h-4 rounded-full w-full"></div>
        <div class="shimmer h-4 rounded-full w-4/5"></div>
        <div class="shimmer h-10 rounded-2xl w-1/3 mt-3"></div>
      </div>
    </div>

    <!-- Result (hidden initially) -->
    <div id="resultState" class="hidden space-y-4"></div>
  `;

  // Simulate AI call — randomly timeout for demo
  const willTimeout = Math.random() < 0.18;
  const delay = willTimeout ? 11000 : 1200 + Math.random()*800;

  const timer = setTimeout(() => {
    if (willTimeout) {
      showTimeout(item);
    } else {
      showResult(item);
    }
  }, delay);

  // allow close to abort
  modal._timer = timer;
}

function showResult(item) {
  const s = item.spark;
  const resultEl = document.getElementById('resultState');
  document.getElementById('loadingState').classList.add('hidden');
  resultEl.classList.remove('hidden');
  resultEl.innerHTML = `
    <!-- category -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-black text-neutral-500">智能分类</span>
      <span class="sticker-tag bg-spark-lavender px-3 py-1 text-xs font-black">${s.category}</span>
    </div>
    <!-- summary -->
    <div>
      <div class="text-xs font-black text-neutral-500 mb-1.5">AI 摘要</div>
      <div class="sticker-alt bg-spark-cream p-3.5">
        <p class="font-bold text-sm leading-relaxed">${s.summary}</p>
      </div>
    </div>
    <!-- recommended questions -->
    <div>
      <div class="text-xs font-black text-neutral-500 mb-2">推荐深度问题</div>
      <div class="space-y-2">
        ${s.questions.map((qq, i) => `
          <button class="q-btn sticker-btn bg-white w-full text-left px-4 py-2.5 text-sm font-bold hover:bg-spark-yellow transition-colors" data-q="${i}">
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-spark-magenta text-white text-xs font-black mr-2">${i+1}</span>
            ${qq.q}
          </button>
        `).join('')}
      </div>
    </div>
    <p class="text-[11px] text-neutral-400 font-bold text-center pt-2">Powered by G-Spark Agent · JSON Mode · 已启用防幻觉约束</p>
  `;
  resultEl.querySelectorAll('.q-btn').forEach(b => {
    b.addEventListener('click', () => handleQuestion(b, item));
  });
}

function showTimeout(item) {
  document.getElementById('loadingState').classList.add('hidden');
  const resultEl = document.getElementById('resultState');
  resultEl.classList.remove('hidden');
  resultEl.innerHTML = `
    <div class="text-center py-6">
      <div class="w-16 h-16 bg-spark-yellow sticker mx-auto flex items-center justify-center mb-4">
        <svg viewBox="0 0 24 24" class="w-9 h-9" fill="#000"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      </div>
      <h4 class="font-black text-lg mb-1">Spark 脑机接口拥堵</h4>
      <p class="text-sm text-neutral-500 font-bold mb-5">大模型接口响应超时，请重试。</p>
      <button class="retry-btn sticker-btn bg-spark-magenta text-white px-6 py-2.5 text-sm font-black inline-flex items-center gap-2">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        重新触发
      </button>
    </div>
  `;
  resultEl.querySelector('.retry-btn').addEventListener('click', () => openSpark(item.id));
}

function handleQuestion(btn, item) {
  // Use the pre-generated Agent answer stored in the question object
  const qIdx = parseInt(btn.dataset.q);
  const answer = item.spark.questions[qIdx]?.a || '暂无分析数据。';
  btn.classList.add('bg-spark-yellow');
  // toggle answer inline
  let ans = btn.nextElementSibling;
  if (ans && ans.classList.contains('answer-block')) { ans.remove(); btn.classList.remove('bg-spark-yellow'); return; }
  ans = document.createElement('div');
  ans.className = 'answer-block sticker-alt bg-spark-mint p-3.5 mt-1 text-sm font-bold leading-relaxed';
  // Split answer into caveat + prediction paragraphs at the "但 Spark" boundary
  const parts = answer.split(/(?=但\s*Spark)/);
  const caveat = parts[0].trim();
  // strip the lead-in connector ("但 Spark 根据数据预测：") since the callout carries the label
  const prediction = parts[1] ? parts[1].replace(/^但\s*Spark\s*[^：:]{0,12}[：:]\s*/, '').trim() : '';
  ans.innerHTML = `
    <div class="flex items-center gap-1.5 text-[11px] text-neutral-500 font-black mb-1.5">
      <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="#FF00FF"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      AGENT 回复
    </div>
    <p class="text-neutral-700">${caveat}</p>
    ${prediction ? `
    <div class="mt-2.5 border-l-4 border-spark-magenta bg-spark-yellow/40 rounded-r-xl px-3 py-2">
      <div class="text-[11px] font-black text-spark-magenta tracking-wide mb-1">SPARK 数据预测</div>
      <p class="text-spark-skyDeep">${prediction}</p>
    </div>` : ''}
  `;
  btn.insertAdjacentElement('afterend', ans);
  ans.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ============================ MODAL CONTROLS ============================ */
function closeModal() {
  if (modal._timer) clearTimeout(modal._timer);
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}
closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ============================ INIT ============================ */
renderFeed();
</script>
</body>
</html>
